<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety score · Three color schemes</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Three ways from green to red.</h1><p>Same 1–10 safety scale. Yellow begins at <strong>4</strong> in every scheme.</p></header>
<nav aria-label="Comparison controls"><strong id="count"></strong><span id="position" aria-live="polite"></span><div><button id="previous" aria-label="Previous scheme">←</button><button id="next" aria-label="Next scheme">→</button><button id="reset">Reset comparison</button></div></nav>
<main id="choices" aria-label="Color schemes"></main><section id="restore" aria-label="Restore schemes"></section><footer><p>Illustrative scores using the app’s current labels. Preview only; scoring and live colors are unchanged.</p><p id="selection" role="status">Choose a scheme to mark your favorite.</p></footer>
<script type="module" src="viewer.js"></script></body></html>
