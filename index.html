<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#322e2e;color:#e2e8f0;min-height:100vh;padding:0 12px 48px}
img,svg{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit}

/* Header */
header{padding:16px 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;position:sticky;z-index:10;}
header h1{font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#f1f5f9}
header .updated{font-size:0.75rem;color:#a2aab6;margin-left:auto}

/* Day tabs */
.day-tabs{display:flex;gap:6px;width:100%;margin-top:8px}
.day-tabs button{flex:1;padding:10px 6px;border:1px solid #687a97;border-radius:10px;background:#65656540;color:#c7d1e1;font-size:0.8rem;font-weight:600;text-align:center;line-height:1.3;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.day-tabs button small{display:block;font-weight:400;font-size:0.7rem;color:#93a1b6;margin-top:1px}
.day-tabs button.active{border-color:#3b82f6;background:rgba(59,130,246,0.12);color:#bad9fd}
.day-tabs button.active small{color:#60a5fa}

/* Card grid */
.card-grid{display:grid;gap:12px}
.card{border:1px solid #687a97;border-radius:4px;padding:16px}
.card h2{font-size:1.05rem;font-weight:600;color:#e2e8f0;margin-bottom:12px;letter-spacing:-0.01em}
@media(min-width:768px){.card-grid{grid-template-columns:1fr 1fr}.card-grid .full{grid-column:1/-1}}

/* Inner Richmond grid */
.richmond-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.richmond-grid .stat-box{background:rgba(255,255,255,0.03);border-radius:10px;padding:12px}
.richmond-grid .stat-box .label{display:block;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;margin-bottom:4px}
.richmond-grid .stat-box .value{font-size:1.25rem;font-weight:600;color:#e2e8f0}
.richmond-grid .stat-box .sub{font-size:0.75rem;color:#94a3b8;margin-top:2px}

/* Chart containers */
.chart-wrap{position:relative;width:100%;margin-top:4px}
.chart-wrap canvas{width:100%!important;max-height:180px}

/* Tide times */
.tide-times{display:flex;gap:12px;margin:8px 0 12px}
.tide-times .tide-item{flex:1;background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;text-align:center}
.tide-times .tide-item .tide-type{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:2px}
.tide-times .tide-item.high .tide-type{color:#60a5fa}
.tide-times .tide-item.low .tide-type{color:#f59e0b}
.tide-times .tide-item .tide-time{font-size:1.1rem;font-weight:600;color:#e2e8f0}
.tide-times .tide-item .tide-height{font-size:0.85rem;color:#94a3b8;margin-top:1px}
.water-temp{text-align:center;padding:8px;background:rgba(255,255,255,0.03);border-radius:10px;font-size:0.85rem;color:#b0bcc8}
.water-temp strong{color:#e2e8f0;font-size:1rem}

/* Regions */
.region-group{margin-top:12px}
.region-group:first-child{margin-top:0}
.region-group .group-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:#cad2dd;margin-bottom:6px;padding:0 4px}
.region-row{display:flex;flex-wrap:wrap;gap:6px}
.region-item{flex:1 1 100%;border-radius:2px;padding:12px 14px;display:flex;align-items:center;gap:0px;background-size:cover;background-position:center;background-repeat:no-repeat;min-height:60px}
.region-item .name{font-size:0.85rem;font-weight:500;color:#e2e8f0;min-width:0}
.region-item .temps{font-size:0.85rem;font-weight:600;color:#e2e8f0;white-space:nowrap}
.region-item .precip{font-size:0.75rem;color:#003fbe;margin-left:auto;white-space:nowrap}
.region-item.sunny{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.5)),url('/images/sunny.jpg')}
.region-item.cloudy{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.4)),url('/images/cloudy.jpg')}
.region-item.partly-cloudy{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.5)),url('/images/partly-cloudy.jpg')}
.region-item.rainy{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.5)),url('/images/rainy.jpg')}
.region-item.snowy{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.5)),url('/images/snowy.jpg')}
.region-item.thunder{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.5)),url('/images/thunder.jpg')}
.region-item.hail{background-image:linear-gradient(rgba(11,17,32,0.2),rgba(11,17,32,0.5)),url('/images/hail.jpg')}

/* Region click */
.region-item{cursor:pointer}

/* Detail nav */
.detail-nav{margin-bottom:12px}
.back-btn{background:none;border:1px solid #687a97;border-radius:8px;color:#c7d1e1;padding:8px 16px;font-size:0.85rem;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.back-btn:hover{background:rgba(255,255,255,0.06);border-color:#3b82f6;color:#bad9fd}

/* Loading */
.loading{text-align:center;padding:40px 16px;color:#64748b;font-size:0.9rem}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error{color:#fca5a5;font-size:0.8rem;padding:4px 0}

/* Desktop */
@media(min-width:640px){
  .region-item{flex:1 1 calc(50% - 3px)}
}
@media(min-width:768px){
  body{padding:0 24px 48px}
  .region-item{flex:1 1 calc(25% - 5px)}
}
@media(min-width:1024px){
  body{padding:0 48px 48px;max-width:1200px;margin:0 auto}
  .region-item{flex:1 1 calc(20% - 5px)}
}

/* Sunline section system: full-bleed bands replace the three outer cards. */

header{padding:24px var(--content-gutter,16px) 14px;background:linear-gradient(160deg,#f7dfb6 0,#f6d7a5 100%)}

.card-grid{display:block}

function findHighLow(predictions){
  const pts=predictions.map(p=>({t:p.t,v:+p.v}));
  const hl=[];
  for(let i=1;i<pts.length-1;i++){
    if(pts[i].v>pts[i-1].v&&pts[i].v>pts[i+1].v)
      hl.push({t:pts[i].t,v:String(pts[i].v),type:'H'});
    if(pts[i].v<pts[i-1].v&&pts[i].v<pts[i+1].v)
      hl.push({t:pts[i].t,v:String(pts[i].v),type:'L'});
  }
  return {predictions:hl};
}

// ── Helpers ──
const UV_SAFE=2;
function degToDir(d){return DIRS[Math.round(d/22.5)%16]}
function parseTime(s){const m=s.match(/T(\d{2}):(\d{2})/);return m?{h:+m[1],m:+m[2]}:null}
function parseDate(s){const m=s.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:''}
function fmtTime(s){const p=parseTime(s);if(!p)return'--';const a=p.h>=12?'p':'a';const h=p.h%12||12;return h+':'+String(p.m).padStart(2,'0')+a}
function fmtHour(s){const p=parseTime(s);if(!p)return'';const a=p.h>=12?'p':'a';return(p.h%12||12)+a}
function dayLabel(dateStr,i){const d=new Date(dateStr+'T12:00-07:00');const opts={weekday:'short',month:'short',day:'numeric'};return i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-US',opts)}

function uvCrossTime(t0,uv0,t1,uv1,thr){
  const p0=parseTime(t0),p1=parseTime(t1);
  if(!p0||!p1||uv1===uv0)return null;
  let m0=p0.h*60+p0.m,m1=p1.h*60+p1.m;
  if(m1<m0)m1+=1440;
  const frac=(thr-uv0)/(uv1-uv0);
  if(frac<0||frac>1)return null;
  let cross=((m0+frac*(m1-m0))%1440+1440)%1440;
  let h=Math.floor(cross/60),m=Math.round(cross%60);
  if(m===60){m=0;h=(h+1)%24;}
  const a=h>=12?'p':'a';
  return(h%12||12)+':'+String(m).padStart(2,'0')+a;
}

function ymdDash(d){return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6)}

function omParams(extra){
  const p=new URLSearchParams({
    timezone:'America/Los_Angeles',
    temperature_unit:'fahrenheit',
    wind_speed_unit:'mph',
    forecast_days:'3',
  });
  extra.split('&').forEach(kv=>{
    const i=kv.indexOf('=');
    if(i<0)return;
    p.set(decodeURIComponent(kv.slice(0,i)), decodeURIComponent(kv.slice(i+1)));
  });
  return p;
}

async function fetchOM(lat,lon,extra){
  const p=omParams(extra);
  p.set('latitude',lat);
  p.set('longitude',lon);
  const r=await fetch(OM_BASE+'?'+p.toString());
  if(!r.ok)throw new Error('OM '+r.status);
  return r.json();
}

// Batch multiple coordinates into a single Open-Meteo request.
// Returns an array of results in the same order as the input coordinates.
async function fetchOMMulti(lats,lons,extra){
  const p=omParams(extra);
  p.set('latitude',lats.join(','));
  p.set('longitude',lons.join(','));
  const r=await fetch(OM_BASE+'?'+p.toString());
  if(!r.ok)throw new Error('OM '+r.status);
  const data=await r.json();
  return Array.isArray(data)?data:[data];
}

async function fetchTides(date,product){
  const r=await fetch('/api/tides?date='+date+'&product='+product);
  if(!r.ok)throw new Error('Tides '+r.status);
  return r.json();
}

// Historical hourly rain for the swim-safety rules. forecast_days=1 anchors
// the newest day as "today" so the window math below stays simple.
async function fetchRainHistory(lat,lon){
  return fetchOM(lat,lon,'past_days=5&forecast_days=1&hourly=precipitation&precipitation_unit=inch');
}

// Historical + forecast hourly rain for the runoff chart (past 5 days through
// the 3-day forecast). Kept separate from the advisory's historical-only series.
async function fetchRainChartSeries(lat,lon){
  return fetchOM(lat,lon,'past_days=5&forecast_days=3&hourly=precipitation&precipitation_unit=inch');
}

// ── Main ──
async function init(){
  try {
    const now=new Date();
    state.dayDates=[];
    for(let i=0;i<3;i++){
      const d=new Date(now); d.setDate(d.getDate()+i);
      state.dayDates[i]=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    }

    // Build date strings for labels
    const dateLabels=state.dayDates.map((d,i)=>{
      const y=d.slice(0,4),m=d.slice(4,6),dd=d.slice(6);
      return dayLabel(y+'-'+m+'-'+dd,i);
    });

    const common='forecast_days=3&timezone=America%2FLos_Angeles&temperature_unit=fahrenheit&wind_speed_unit=mph';
    const irParams=common+'&daily=sunrise,sunset,uv_index_max&hourly=uv_index,temperature_2m,precipitation&precipitation_unit=inch';
    const bbParams=common+'&hourly=wind_speed_10m,wind_direction_10m';
    const regParams=common+'&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code';

    // Each section loads independently; one failure no longer blocks the rest.
    const [irRes,bbRes,tideRes,regRes,localRainRes,inlandRainRes,localFcRes,inlandFcRes]=await Promise.allSettled([
      fetchOM(LOCATIONS[0].lat,LOCATIONS[0].lon,irParams), // Inner Richmond
      fetchOM(SWIM_SPOTS.innerRichmond.lat,SWIM_SPOTS.innerRichmond.lon,bbParams), // Baker Beach wind
      Promise.all(state.dayDates.map(d=>fetchTides(d,'predictions'))),
      fetchOMMulti(LOCATIONS.map(l=>l.lat),LOCATIONS.map(l=>l.lon),regParams),
      fetchRainHistory(SWIM_SPOTS.innerRichmond.lat,SWIM_SPOTS.innerRichmond.lon), // local runoff (Baker Beach)
      fetchRainHistory(INLAND_REF._default.lat,INLAND_REF._default.lon), // inland runoff (Vallejo)
      fetchRainChartSeries(SWIM_SPOTS.innerRichmond.lat,SWIM_SPOTS.innerRichmond.lon), // runoff chart (Baker Beach)
      fetchRainChartSeries(INLAND_REF._default.lat,INLAND_REF._default.lon), // runoff chart (Vallejo)
    ]);

    if(irRes.status==='fulfilled')state.irData=irRes.value;
    else console.error('Daylight section failed:',irRes.reason);

    if(bbRes.status==='fulfilled')state.bbData=bbRes.value;
    else console.error('Swim section failed:',bbRes.reason);

    if(tideRes.status==='fulfilled')state.tides={predictions:tideRes.value.flatMap(r=>r.predictions||[])};
    else console.error('Tide section failed:',tideRes.reason);

    if(regRes.status==='fulfilled'){
      const regMap={};
      LOCATIONS.forEach((l,i)=>{regMap[l.id]={data:regRes.value[i],name:l.name,group:l.group}});
      state.regions=regMap;
    } else console.error('Regional section failed:',regRes.reason);

    if(localRainRes.status==='fulfilled')state.rainLocal.innerRichmond=localRainRes.value;
    else console.error('Local rain history failed:',localRainRes.reason);

    if(inlandRainRes.status==='fulfilled')state.rainInlandBay=inlandRainRes.value;
    else console.error('Inland rain history failed:',inlandRainRes.reason);

    if(localFcRes.status==='fulfilled')state.rainLocalFc.innerRichmond=localFcRes.value;
    else console.error('Local runoff chart failed:',localFcRes.reason);

    if(inlandFcRes.status==='fulfilled')state.rainInlandFc=inlandFcRes.value;
    else console.error('Inland runoff chart failed:',inlandFcRes.reason);

    // URL routing — check if a region was linked directly
    const path=window.location.pathname.replace(/^\//,'');
    if(path){
      const match=LOCATIONS.find(l=>l.id===path);
      if(match){
        state.selectedRegion=match.id;
        await loadRegionDetail(match.id);
      }
    }

    // Build DOM
    buildUI(dateLabels);
    renderDay(0);

  } catch(e){
    const loading=document.getElementById('loading');
    if(loading)loading.innerHTML='<div class="error">Failed to load weather data. Please refresh.</div>';
    console.error(e);
  }
}

      if(yMax<=yMin)yMax=yMin+1;

      labels.forEach((label,i)=>{if(i%Math.max(1,Math.ceil(labels.length/7)))return;const x=left+(labels.length<2?pw/2:pw*i/(labels.length-1));const t=svgEl('text',{x,y:h-7,'text-anchor':'middle',fill:text,'font-size':9});t.textContent=label;svg.appendChild(t)});
      (this.data.datasets||[]).forEach((dataset,di)=>{
        const values=dataset.data||[];const isBar=(dataset.type||this.config.type)==='bar';const color=Array.isArray(dataset.backgroundColor)?(dataset.backgroundColor[0]||'#e85d32'):(dataset.borderColor||dataset.backgroundColor||'#e85d32');
        if(isBar){const barW=Math.max(3,pw/Math.max(values.length,1)*.55);values.forEach((value,i)=>{if(!Number.isFinite(value))return;const x=left+(labels.length<2?pw/2:pw*i/(labels.length-1))-barW/2,y=top+ph*(yMax-value)/(yMax-yMin);svg.appendChild(svgEl('rect',{x,y,width:barW,height:Math.max(1,top+ph-y),fill:Array.isArray(dataset.backgroundColor)?(dataset.backgroundColor[i]||color):color,opacity:.72,rx:2}))});return}
        const axis=dataset.yAxisID==='yTemp'?(scales.yTemp||{}):yScale;const min=Number.isFinite(axis.min)?axis.min:yMin;const max=Number.isFinite(axis.max)?axis.max:yMax;const points=values.map((value,i)=>{if(!Number.isFinite(value))return null;const x=left+(labels.length<2?pw/2:pw*i/(labels.length-1));const y=top+ph*(max-value)/(max-min);return x+','+y}).filter(Boolean).join(' ');

    if(y<ca.top||y>ca.bottom)return;
    ctx.save();
    ctx.setLineDash([4,4]);
    ctx.strokeStyle='rgba(239,68,68,0.6)';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(ca.left,y);ctx.lineTo(ca.right,y);ctx.stroke();

    ctx.fillStyle='rgba(239,68,68,0.7)';

    ctx.fillText('UV 2',ca.left+6,y-4);

const runoffOverlay={
  id:'runoffOverlay',
  // Subtle tint over the forecast region (after "now").
  beforeDatasetsDraw(chart){
    const {ctx,chartArea:ca}=chart;
    if(!ca)return;
    const ti=chart._todayIndex;
    if(ti===undefined||ti===null||ti<0)return;
    const meta=chart.getDatasetMeta(0);
    const el=meta&&meta.data&&meta.data[ti];
    if(!el)return;
    const x0=el.x-el.width/2;
    if(x0<=ca.left||x0>=ca.right)return;
    ctx.save();
    ctx.fillStyle='rgba(232,93,50,0.06)';
    ctx.fillRect(x0,ca.top,ca.right-x0,ca.bottom-ca.top);
    ctx.restore();
  },
  // Cutoff lines + "now" divider, drawn over the datasets.
  afterDatasetsDraw(chart){
    const {ctx,chartArea:ca,scales}=chart;
    if(!scales.y||!scales.x)return;
    ctx.save();
    ctx.textBaseline='bottom';
    const cuts=[
      {v:SWIM_SAFETY.localThreshold,c:'#e85d32',label:'local '+fmtIn(SWIM_SAFETY.localThreshold)},
      {v:SWIM_SAFETY.inlandThreshold,c:'#0b6f93',label:'inland '+fmtIn(SWIM_SAFETY.inlandThreshold)},
    ];
    cuts.forEach(cut=>{
      const y=scales.y.getPixelForValue(cut.v);
      if(y<ca.top||y>ca.bottom)return;
      ctx.setLineDash([6,4]);
      ctx.strokeStyle=cut.c;
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(ca.left,y);ctx.lineTo(ca.right,y);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=cut.c;
      ctx.font='bold 9px system-ui';
      ctx.textAlign='right';
      ctx.fillText(cut.label,ca.right-4,y-3);
    });
    const ti=chart._todayIndex;
    if(ti!==undefined&&ti!==null&&ti>=0){
      const meta=chart.getDatasetMeta(0);
      const el=meta&&meta.data&&meta.data[ti];
      if(el){
        const x=el.x;
        if(x>=ca.left&&x<=ca.right){
          ctx.setLineDash([3,3]);
          ctx.strokeStyle='rgba(119,121,110,0.7)';
          ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(x,ca.top);ctx.lineTo(x,ca.bottom);ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle='rgba(119,121,110,0.9)';
          ctx.font='9px system-ui';
          ctx.textAlign='center';
          ctx.fillText('now',x,ca.top+9);
        }
      }
    }
    ctx.restore();
  }
};

// ── Render ──
// Show or clear an inline error within a single card, so a failed
// section doesn't take down the whole dashboard.
function setSectionError(cardId,message){
  const card=document.getElementById(cardId);
  if(!card)return;
  let el=card.querySelector('.section-error');
  if(message){
    if(!el){
      el=document.createElement('div');
      el.className='error section-error';
      el.style.padding='2px 0 10px';
      const h2=card.querySelector('h2');
      if(h2&&h2.parentNode===card)h2.after(el);
      else card.prepend(el);
    }
    el.textContent=message;
  } else if(el){
    el.remove();
  }
}

function renderDay(idx){
  const isDetail=!!state.selectedRegion;

  if(isDetail){
    const loc=LOCATIONS.find(l=>l.id===state.selectedRegion);
    const spot=SWIM_SPOTS[state.selectedRegion];

    if(loc&&spot&&cache){
      regionData=cache.regionData;
      swimData=cache.swimData;

      regionLabel=loc.name;
      swimLabel=spot.name;
      swimSpotId=state.selectedRegion;
    } else {

    }

function updateSun(idx,d){
  if(!d)d=state.irData;
  if(!d||!d.daily)return;
  const sr=d.daily.sunrise[idx],ss=d.daily.sunset[idx];
  document.getElementById('sunriseVal').textContent=sr?fmtTime(sr):'--';
  document.getElementById('sunsetVal').textContent=ss?fmtTime(ss):'--';
  // Compute day length
  if(sr&&ss){
    const srP=parseTime(sr),ssP=parseTime(ss);
    if(srP&&ssP){
      let mins=((ssP.h*60+ssP.m)-(srP.h*60+srP.m));
      if(mins<0)mins+=1440;
      const h=Math.floor(mins/60),m=mins%60;
      document.getElementById('sunsetSub').textContent='\n'+h+'h '+m+'m';
    }
  }
  document.getElementById('uvMaxVal').textContent=d.daily.uv_index_max?d.daily.uv_index_max[idx].toFixed(1):'--';
}

function updateUV(idx,d){
  if(!d)d=state.irData;
  if(!d||!d.hourly)return;
  const start=idx*24,end=start+24;
  const times=d.hourly.time.slice(start,end);
  const uv=d.hourly.uv_index.slice(start,end);
  const temp=d.hourly.temperature_2m?d.hourly.temperature_2m.slice(start,end):[];

  const dayIdx=[];
  const dayTimes=[];
  const dayUV=[];
  const dayTemp=[];
  times.forEach((t,i)=>{
    const p=parseTime(t);
    if(p&&p.h>=5&&p.h<=21){
      dayIdx.push(i);
      dayTimes.push(fmtHour(t));
      dayUV.push(uv[i]);
      dayTemp.push(temp.length>i?temp[i]:null);
    }
  });

  const maxUV=uv.length?Math.max(...uv.map(v=>Number.isFinite(v)?v:0)):0;
  let safeText='';
  if(maxUV<UV_SAFE){
    safeText='All day';
  } else {
    const morningSafe=uv.findIndex(v=>v>=UV_SAFE);
    const eveningSafe=uv.length-1-[...uv].reverse().findIndex(v=>v>=UV_SAFE);
    if(morningSafe>0){
      const t=uvCrossTime(times[morningSafe-1],uv[morningSafe-1],times[morningSafe],uv[morningSafe],UV_SAFE);
      safeText='Before '+(t||fmtTime(times[morningSafe]));
    }
    if(morningSafe>0&&eveningSafe>=0&&eveningSafe<uv.length-1)safeText+='\n';
    if(eveningSafe>=0&&eveningSafe<uv.length-1){
      const t=uvCrossTime(times[eveningSafe],uv[eveningSafe],times[eveningSafe+1],uv[eveningSafe+1],UV_SAFE);
      safeText+='After '+(t||fmtTime(times[eveningSafe+1]));
    }
  }
  document.getElementById('uvBelowVal').textContent=safeText||'All day above 2';

  // Hide the UV chart when the sun never gets strong enough to matter.
  const showUV=maxUV>=UV_SAFE;
  const uvWrap=document.getElementById('uvChartWrap');
  const uvHint=document.getElementById('uvLowHint');
  if(uvWrap)uvWrap.style.display=showUV?'':'none';
  if(uvHint)uvHint.style.display=showUV?'none':'';

  if(!uvChart)return;
  uvChart.data.labels=dayTimes;
  uvChart.data.datasets[0].data=dayUV;
  uvChart.data.datasets[1].data=dayTemp;
  uvChart.update();
  if(showUV&&uvChart.resize)uvChart.resize();
}

function updateRain(idx,d){
  const section=document.getElementById('rainSection');
  if(!section)return;
  if(!d)d=state.irData;
  if(!d||!d.hourly||!d.hourly.precipitation){
    section.style.display='none';
    return;
  }
  const start=idx*24,end=start+24;
  const times=d.hourly.time.slice(start,end);
  const precip=d.hourly.precipitation.slice(start,end);

  const total=precip.reduce((a,b)=>a+(Number.isFinite(b)?b:0),0);
  if(total<0.01||!times.length){
    section.style.display='none';
    return;
  }

  section.style.display='';

  let peakIdx=-1,peak=0;
  precip.forEach((v,i)=>{if(Number.isFinite(v)&&v>peak){peak=v;peakIdx=i}});

  const totalEl=document.getElementById('rainTotal');
  if(totalEl){
    let text=total.toFixed(2)+'″ total';
    if(peakIdx>=0&&peak>0)text+=' · heaviest '+fmtHour(times[peakIdx]);
    totalEl.textContent=text;
  }

  if(rainChart){
    rainChart.data.labels=times.map(t=>fmtHour(t));
    rainChart.data.datasets[0].data=precip;
    rainChart.update();
    if(rainChart.resize)rainChart.resize();
  }
}

// ── Swim safety advisory ──
// Aggregate hourly rain into calendar-day totals, then check two windows:
// local runoff (previous 2 days) and inland runoff (2-5 days ago).
function rainWindows(data){
  if(!data||!data.hourly||!data.hourly.time)return null;
  const {time,precipitation}=data.hourly;
  const byDate={};
  time.forEach((t,i)=>{
    const d=t.slice(0,10);
    const v=precipitation[i];
    if(Number.isFinite(v))byDate[d]=(byDate[d]||0)+v;
  });
  const dates=Object.keys(byDate).sort();
  const n=dates.length;
  // forecast_days=1 => dates[n-1] is today; offset 1 = yesterday, 2 = 2 days ago…
  const amt=off=>(off>=1&&off<n)?(byDate[dates[n-1-off]]||0):0;
  const days=[];
  for(let off=1;off<=SWIM_SAFETY.pastDays;off++)days.push({ago:off,amount:amt(off)});
  const pick=(start,count)=>days.filter(d=>d.ago>=start&&d.ago<start+count);
  const local=pick(1,SWIM_SAFETY.localWindow).reduce((a,d)=>a+d.amount,0);
  const inlandDays=pick(SWIM_SAFETY.inlandWindowStart,SWIM_SAFETY.inlandWindowDays);
  const inland=inlandDays.reduce((a,d)=>a+d.amount,0);
  const inlandMaxDay=inlandDays.length?Math.max(...inlandDays.map(d=>d.amount)):0;
  return {local,inland,inlandMaxDay,days};
}

function fmtIn(v){
  return v.toFixed(2).replace(/\.?0+$/,'')+'\u2033';
}

function describeSource(kind,total,days){
  const rainy=days.filter(d=>d.amount>0);
  const recent=rainy.length?rainy.reduce((a,b)=>a.ago<b.ago?a:b):null;
  let s=fmtIn(total)+' '+kind;
  if(recent)s+=' '+recent.ago+' day'+(recent.ago===1?'':'s')+' ago';
  return s;
}

function updateSwimAdvisory(spotId){
  const el=document.getElementById('swimAdvisory');
  if(!el)return;
  const localWin=rainWindows(state.rainLocal[spotId]);
  const inlandWin=rainWindows(inlandSeriesFor(spotId));

  if(!localWin&&!inlandWin){el.className='';el.textContent='';return;}

  const hasLocal=!!localWin,hasInland=!!inlandWin;
  const localTotal=localWin?localWin.local:0;
  const inlandTotal=inlandWin?inlandWin.inland:0;
  const inlandMax=inlandWin?inlandWin.inlandMaxDay:0;

  const localTriggered=hasLocal&&localTotal>=SWIM_SAFETY.localThreshold;
  const inlandTriggered=hasInland&&(inlandTotal>=SWIM_SAFETY.inlandThreshold||inlandMax>=SWIM_SAFETY.inlandSingleDay);

  if(!localTriggered&&!inlandTriggered){
    el.className='runoff-ok';
    el.textContent='no runoff warning';
    return;
  }

  const parts=[];
  if(localTriggered){
    const localDays=localWin.days.filter(d=>d.ago<=SWIM_SAFETY.localWindow);
    parts.push(describeSource('local',localTotal,localDays));
  }
  if(inlandTriggered){
    const start=SWIM_SAFETY.inlandWindowStart;
    const inlandDays=inlandWin.days.filter(d=>d.ago>=start&&d.ago<start+SWIM_SAFETY.inlandWindowDays);
    parts.push(describeSource('inland',inlandTotal,inlandDays));
  }
  el.className='runoff-warn';
  el.textContent='Runoff warning: '+parts.join(' and ');
}

// Aggregate hourly rain into daily totals, sorted chronologically.
function dailyTotals(data){
  if(!data||!data.hourly||!data.hourly.time)return null;
  const {time,precipitation}=data.hourly;
  const byDate={};
  time.forEach((t,i)=>{
    const d=t.slice(0,10);
    const v=precipitation[i];
    if(Number.isFinite(v))byDate[d]=(byDate[d]||0)+v;
  });
  return Object.keys(byDate).sort().map(d=>({date:d,total:byDate[d]}));
}

function fmtDayShort(dateStr){
  const p=dateStr.split('-');
  return (+p[1])+'/'+(+p[2]);
}

// Trailing N-day sum for each day, so the runoff total rises and falls as the
// window slides over the timeline.
function rollingWindow(daily,windowDays){
  const out=[];
  let sum=0;
  for(let i=0;i<daily.length;i++){
    sum+=daily[i];
    if(i>=windowDays)sum-=daily[i-windowDays];
    out.push(sum);
  }
  return out;
}

function updateRunoff(spotId){
  const section=document.getElementById('runoffSection');
  if(!section)return;

  const localSeries=state.rainLocalFc[spotId];
  const inlandSeries=inlandChartSeriesFor(spotId);

  const localTotals=dailyTotals(localSeries);
  const inlandTotals=dailyTotals(inlandSeries);

  // Build a unified day axis from both series.
  const axisSet=new Set();
  if(localTotals)localTotals.forEach(t=>axisSet.add(t.date));
  if(inlandTotals)inlandTotals.forEach(t=>axisSet.add(t.date));
  const axis=[...axisSet].sort();

  if(!axis.length){
    section.style.display='none';
    return;
  }

  const localMap={},inlandMap={};
  if(localTotals)localTotals.forEach(t=>localMap[t.date]=t.total);
  if(inlandTotals)inlandTotals.forEach(t=>inlandMap[t.date]=t.total);

  const localDaily=axis.map(d=>localMap[d]||0);
  const inlandDaily=axis.map(d=>inlandMap[d]||0);

  // Hide only when there's essentially no rain at all — past or forecast.
  const totalRain=localDaily.reduce((a,b)=>a+b,0)+inlandDaily.reduce((a,b)=>a+b,0);
  if(totalRain<0.01){
    section.style.display='none';
    return;
  }
  section.style.display='';

  // Rolling-window totals (the runoff windows): local = trailing 2 days,
  // inland = trailing 4 days. Sliding day-by-day makes these rise and fall.
  const localCum=rollingWindow(localDaily,SWIM_SAFETY.localWindow);
  const inlandCum=rollingWindow(inlandDaily,SWIM_SAFETY.inlandWindowDays);

  const todayStr=ymdDash(state.dayDates[0]);
  const todayIndex=axis.indexOf(todayStr);

  // Split into "so far" (through today) vs "expected" (future forecast).
  let localPast=0,inlandPast=0,localFc=0,inlandFc=0;
  axis.forEach((d,i)=>{
    if(d>todayStr){localFc+=localDaily[i];inlandFc+=inlandDaily[i];}
    else {localPast+=localDaily[i];inlandPast+=inlandDaily[i];}
  });

  const totalEl=document.getElementById('runoffTotal');
  if(totalEl){
    totalEl.innerHTML='<span class="local">Local '+fmtIn(localPast)+'</span> · <span class="inland">Inland '+fmtIn(inlandPast)+'</span>';
  }
  const fcstEl=document.getElementById('runoffFcst');
  if(fcstEl){
    if(localFc+inlandFc>0.01){
      fcstEl.style.display='';
      fcstEl.innerHTML='Expected <span class="local">+'+fmtIn(localFc)+'</span> local · <span class="inland">+'+fmtIn(inlandFc)+'</span> inland';
    } else {
      fcstEl.style.display='none';
    }
  }

  if(!runoffChart)return;
  runoffChart.data.labels=axis.map(fmtDayShort);
  runoffChart.data.datasets[0].data=localDaily;
  runoffChart.data.datasets[1].data=inlandDaily;
  runoffChart.data.datasets[2].data=localCum;
  runoffChart.data.datasets[3].data=inlandCum;
  runoffChart._todayIndex=todayIndex;
  const maxVal=Math.max(
    Math.max(0,...localCum),
    Math.max(0,...inlandCum),
    SWIM_SAFETY.localThreshold,
    SWIM_SAFETY.inlandThreshold
  );
  runoffChart.options.scales.y.max=maxVal*1.15;
  runoffChart.update();
  if(runoffChart.resize)runoffChart.resize();
}

function updateRegions(idx){
  const container=document.getElementById('regionContainer');
  if(!container)return;

  const groups={};
  LOCATIONS.forEach(l=>{
    if(!groups[l.group])groups[l.group]=[];
    groups[l.group].push(l);
  });

  let html='';
  Object.keys(groups).forEach(group=>{
    html+=`<div class="region-group"><div class="group-title">${group}</div><div class="region-row">`;
    groups[group].forEach(l=>{
      const r=state.regions[l.id];
      const d=r&&r.data&&r.data.daily;
      if(d){
        const hi=d.temperature_2m_max?d.temperature_2m_max[idx]:null;
        const lo=d.temperature_2m_min?d.temperature_2m_min[idx]:null;
        const pr=d.precipitation_sum?d.precipitation_sum[idx]:null;
        const wc=d.weather_code?d.weather_code[idx]:null;
        const wi=wc!==null?wmoInfo(wc):{t:'Unknown',c:''};
        const tempStr=hi!==null&&lo!==null?Math.round(hi)+'°/'+Math.round(lo)+'°':hi!==null?Math.round(hi)+'°':'--';
        const prStr=pr!==null?pr.toFixed(1):'--';
        html+=`<div class="region-item ${wi.c}" data-id="${l.id}"><span class="name">${l.short||l.name} </span><span class="temps">${tempStr}</span><span class="precip">${prStr}″</span></div>`;
      } else {
        html+=`<div class="region-item" data-id="${l.id}"><span class="name">${l.short||l.name}</span><span class="temps">--</span><span class="precip">--</span></div>`;
      }
    });
    html+=`</div></div>`;
  });
  container.innerHTML=html;
}

// ── Navigation ──
async function loadRegionDetail(regionId){
  const spot=SWIM_SPOTS[regionId];
  if(!spot||state.detailCache[regionId])return;
  const loc=LOCATIONS.find(l=>l.id===regionId);
  if(!loc)return;
  const common='forecast_days=3&timezone=America%2FLos_Angeles&temperature_unit=fahrenheit&wind_speed_unit=mph';
  try {
    const [regionDetail,swimDetail,localRain,localFc]=await Promise.all([
      fetchOM(loc.lat,loc.lon,common+'&daily=sunrise,sunset,uv_index_max&hourly=uv_index,temperature_2m,precipitation&precipitation_unit=inch'),
      fetchOM(spot.lat,spot.lon,common+'&hourly=wind_speed_10m,wind_direction_10m'),
      fetchRainHistory(spot.lat,spot.lon),
      fetchRainChartSeries(spot.lat,spot.lon),
    ]);
    state.detailCache[regionId]={regionData:regionDetail,swimData:swimDetail};
    if(localRain)state.rainLocal[regionId]=localRain;
    if(localFc)state.rainLocalFc[regionId]=localFc;
  } catch(e){
    console.error('Region detail failed ('+regionId+'):',e);
  }
}

function scrollToPageTop(){
  window.scrollTo({
    top:0,
    behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',
  });
}

// Region click
document.addEventListener('click',e=>{
  const item=e.target.closest('.region-item');
  if(item&&item.dataset.id){
    const id=item.dataset.id;
    const regionChanged=state.selectedRegion!==id;
    history.pushState(null,'','/'+id);
    state.selectedRegion=id;
    if(regionChanged)scrollToPageTop();
    renderDay(state.activeDay);
    loadRegionDetail(id).then(()=>renderDay(state.activeDay));
  }
});

// Browser back/forward
window.addEventListener('popstate',()=>{
  const path=window.location.pathname.replace(/^\//,'');
  if(path){
    const match=LOCATIONS.find(l=>l.id===path);
    if(match){
      const regionChanged=state.selectedRegion!==match.id;
      state.selectedRegion=match.id;
      if(regionChanged)scrollToPageTop();
      renderDay(state.activeDay);
      loadRegionDetail(match.id).then(()=>renderDay(state.activeDay));
      return;
    }
  }
  state.selectedRegion=null;
  renderDay(state.activeDay);
});

// ── Start ──
init();
</script>
