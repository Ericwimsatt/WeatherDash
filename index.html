<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf1df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>WeatherDash</title>
    <style>
      body {
        margin: 0;
        background: #fbf1df;
        color: #2d2018;
        font-family: system-ui, sans-serif;
      }
      .boot-header {
        padding: 24px 16px;
        background: #f6d7a5;
      }
      .boot-header h1 {
        font-size: 1.55rem;
        margin: 0;
      }
      .boot-section {
        padding: 26px 16px;
      }
      .boot-section:nth-child(2) {
        background: #d8eef4;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        max-width: 1200px;
        margin: auto;
      }
      .boot-block {
        height: 80px;
        background: #ead3b4;
        border-radius: 16px;
      }
      .boot-chart {
        height: 180px;
        background: #f5e5c8;
        grid-column: 1/-1;
        border-radius: 16px;
      }
      .boot-section h2 {
        max-width: 1200px;
        margin: 0 auto 16px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-header">
        <h1>EricWeather</h1>
        <p role="status">Loading weather…</p>
      </div>
      <div aria-hidden="true">
        <section class="boot-section">
          <h2>Daylight</h2>
          <div class="boot-grid">
            <div class="boot-block"></div>
            <div class="boot-block"></div>
            <div class="boot-block"></div>
            <div class="boot-block"></div>
            <div class="boot-chart"></div>
          </div>
        </section>
        <section class="boot-section">
          <h2>Swim Conditions</h2>
          <div class="boot-grid"><div class="boot-chart"></div></div>
        </section>
        <section class="boot-section">
          <h2>Regional Temps</h2>
          <div class="boot-grid">
            <div class="boot-block"></div>
            <div class="boot-block"></div>
          </div>
        </section>
      </div>
    </div>
    <noscript
      ><p>
        Enable JavaScript to load live weather and saved measurements.
      </p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
